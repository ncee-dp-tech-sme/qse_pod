# =============================================================================
# cronjob.yaml - Kubernetes CronJob that runs QSE Pod scans on a schedule
#
# Default schedule: every hour. Adjust spec.schedule as needed.
# Compatible with Kubernetes 1.24+ and OpenShift 4.x.
#
# Changes:
#   2026-08-21 - Initial creation
#   2026-08-21 04:10:14 - Mount qse-pod-repos ConfigMap; removed single-repo env vars
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qse-pod-scan
  namespace: qse-pod
  labels:
    app: qse-pod
spec:
  # Run every hour. Examples:
  #   Every night at 02:00:  "0 2 * * *"
  #   Every 30 minutes:      "*/30 * * * *"
  schedule: "0 * * * *"

  # Prevent overlapping jobs if the previous scan is still running
  concurrencyPolicy: Forbid

  # Keep last 3 successful and 1 failed job for log inspection
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Allow up to 4 hours for the scan + upload to complete
  startingDeadlineSeconds: 14400

  jobTemplate:
    spec:
      # Retry the job once on failure before marking it as failed
      backoffLimit: 1

      template:
        metadata:
          labels:
            app: qse-pod
          annotations:
            # OpenShift: request the restricted-v2 SCC via annotation
            openshift.io/scc: restricted-v2
        spec:
          serviceAccountName: qse-pod-sa
          restartPolicy: OnFailure

          # ---- Security context (OpenShift restricted SCC compatible) --------
          securityContext:
            runAsNonRoot: true
            # OpenShift assigns a random UID; do not hardcode runAsUser here
            # unless you have a specific SCC that permits it.
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: qse-scanner
              image: your-registry.example.com/qse-pod:latest  # Replace with your registry
              imagePullPolicy: Always

              # Container-level security context
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false   # QSE CLI writes temp files
                capabilities:
                  drop: ["ALL"]

              # Resource limits – adjust based on repository size and language
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"

              # ---- Environment variables from ConfigMap (global settings) ----
              envFrom:
                - configMapRef:
                    name: qse-pod-config

              # ---- Sensitive env vars from Secret ----------------------------
              env:
                - name: GCM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qse-pod-secrets
                      key: GCM_API_KEY
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: qse-pod-secrets
                      key: GIT_USERNAME
                      optional: true
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: qse-pod-secrets
                      key: GIT_TOKEN
                      optional: true

              # ---- Volume mounts --------------------------------------------
              volumeMounts:
                - name: results-storage
                  mountPath: /opt/qse-pod/results
                # Repos list mounted read-only at a predictable path
                - name: repos-config
                  mountPath: /etc/qse-repos
                  readOnly: true

          # ---- Volumes -------------------------------------------------------
          volumes:
            - name: results-storage
              persistentVolumeClaim:
                claimName: qse-pod-results
            # Repos ConfigMap mounted as a file: /etc/qse-repos/repos.yaml
            - name: repos-config
              configMap:
                name: qse-pod-repos

          # ---- Image pull secret (if using a private registry) ---------------
          # imagePullSecrets:
          #   - name: registry-credentials
