# =============================================================================
# secret.yaml - Kubernetes/OpenShift Secret for QSE Pod sensitive credentials
#
# IMPORTANT: Replace ALL placeholder values (marked # HashiCorpIgnore) before
# applying this manifest. Never commit real values to source control.
#
# Apply with:
#   kubectl apply -f secret.yaml -n <namespace>
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: qse-pod-secrets
  namespace: qse-pod           # Change to your target namespace
  labels:
    app: qse-pod
type: Opaque
stringData:
  # GCM API key – obtained from your Guardium Cryptography Manager instance
  GCM_API_KEY: "REPLACE_WITH_GCM_API_KEY"                   # HashiCorpIgnore

  # Git credentials for private repository access (leave empty for public repos)
  GIT_USERNAME: "REPLACE_WITH_GIT_USERNAME_OR_LEAVE_EMPTY"  # HashiCorpIgnore
  GIT_TOKEN: "REPLACE_WITH_GIT_PERSONAL_ACCESS_TOKEN"       # HashiCorpIgnore

  # QSE GitHub token (only needed if you re-clone QSE at runtime rather than bake it in)
  # QSE_TOKEN: "REPLACE_WITH_QSE_IBM_GITHUB_TOKEN"          # HashiCorpIgnore
