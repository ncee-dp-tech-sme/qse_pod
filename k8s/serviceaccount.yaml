# =============================================================================
# serviceaccount.yaml - ServiceAccount, Role, and RoleBinding for QSE Pod
#
# The pod needs permission to PATCH its own ConfigMap to persist the last
# processed commit SHA. All other permissions are denied by default.
#
# Changes:
#   2026-08-21 - Initial creation
#   2026-08-21 04:10:14 - Added get permission for qse-pod-repos ConfigMap
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qse-pod-sa
  namespace: qse-pod
  labels:
    app: qse-pod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qse-pod-role
  namespace: qse-pod
  labels:
    app: qse-pod
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["qse-pod-config"]   # patch to persist last commit SHA
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["qse-pod-repos"]    # read-only: repo list
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qse-pod-rolebinding
  namespace: qse-pod
  labels:
    app: qse-pod
subjects:
  - kind: ServiceAccount
    name: qse-pod-sa
    namespace: qse-pod
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: qse-pod-role
