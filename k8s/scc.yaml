# =============================================================================
# scc.yaml - OpenShift SecurityContextConstraints for QSE Pod
#
# This SCC grants the qse-pod-sa ServiceAccount the minimum privileges
# needed to run the scan container under OpenShift's security model.
#
# Apply with (cluster-admin required):
#   oc apply -f scc.yaml
#
# NOTE: On vanilla Kubernetes this file is not used. Skip it for non-OCP clusters.
#
# Changes:
#   2026-08-21 - Initial creation
# =============================================================================
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: qse-pod-scc
  labels:
    app: qse-pod
  annotations:
    kubernetes.io/description: >
      Custom SCC for QSE Pod. Allows non-root execution with arbitrary UIDs
      (as assigned by OpenShift's namespace UID range), read/write to mounted
      volumes, and no privilege escalation.

# Allow arbitrary UIDs within the namespace UID range
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false

# Drop all Linux capabilities
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
allowedCapabilities: []

# Filesystem group must use the namespace-assigned range
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 65535

# Run as non-root, UID assigned by the namespace range
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 1000
  uidRangeMax: 65535

seLinuxContext:
  type: MustRunAs

supplementalGroups:
  type: RunAsAny

# Allow PVC-backed volumes and projected/configmap/secret volumes
volumes:
  - persistentVolumeClaim
  - configMap
  - secret
  - emptyDir
  - projected
  - downwardAPI

# Bind this SCC to the qse-pod ServiceAccount
users:
  - system:serviceaccount:qse-pod:qse-pod-sa
groups: []
