# =============================================================================
# configmap.yaml - Non-sensitive configuration for QSE Pod
#
# Changes:
#   2026-08-21 - Initial creation
#   2026-08-21 04:10:14 - Removed single-repo GIT_REPO_URL/APP_NAME; repos now in qse-pod-repos ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: qse-pod-config
  namespace: qse-pod
  labels:
    app: qse-pod
data:
  # Guardium Cryptography Manager base URL (no trailing slash)
  GCM_SERVER_URL: "https://gcm.your-domain.com"

  # Default version label applied to all repos (leave empty to auto-detect from commit SHA)
  APP_VERSION: ""

  # Default comma-separated exclusion paths (can be overridden per-repo in qse-pod-repos)
  EXCLUDE_PATHS: "src/test,vendor,node_modules,.git"

  # QSE output base directory — results per repo stored in a subdirectory
  QSE_OUTPUT_BASE_DIR: "/opt/qse-pod/results/scans"

  # Base path for last-commit tracking files (one file per repo, named by slug)
  LAST_COMMIT_BASE_DIR: "/opt/qse-pod/results/commits"

  # Set to "true" to scan all supported languages regardless of detection
  SCAN_ALL_LANGUAGES: "false"

  # ConfigMap to patch with per-repo last commit SHAs (optional)
  CONFIGMAP_NAME: "qse-pod-config"
  CONFIGMAP_NAMESPACE: "qse-pod"

  # Path where the repos list ConfigMap is mounted inside the container
  REPOS_FILE: "/etc/qse-repos/repos.yaml"
