# =============================================================================
# repos-configmap.yaml - List of Git repositories for QSE Pod to scan
#
# Add one entry per repository under data.repos in YAML list format.
# Each entry supports:
#   url           (required) HTTPS or SSH URL of the repository
#   app_name      (optional) Label used in GCM scan results; defaults to repo name
#   exclude_paths (optional) Comma-separated paths to exclude; overrides global default
#
# To add a repo:
#   kubectl edit configmap qse-pod-repos -n qse-pod
# — or edit this file and re-apply:
#   kubectl apply -f k8s/repos-configmap.yaml -n qse-pod
#
# The running CronJob will pick up the change on its next scheduled execution.
# No pod restart or CronJob modification is needed.
#
# Changes:
#   2026-08-21 04:10:14 - Initial creation: multi-repo list ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: qse-pod-repos
  namespace: qse-pod
  labels:
    app: qse-pod
data:
  # repos is parsed as YAML inside scan.sh using a simple line reader.
  # Format: one repo block per entry, fields indented with two spaces under "- url:".
  # IMPORTANT: maintain consistent indentation — do not mix tabs and spaces.
  repos.yaml: |
    repos:
      - url: https://github.com/your-org/repo-one.git
        app_name: repo-one
        exclude_paths: src/test,vendor,node_modules,.git

      - url: https://github.com/your-org/repo-two.git
        app_name: repo-two
        exclude_paths: src/test,vendor,node_modules,.git

      # Add more repos below — no other file changes required:
      # - url: https://github.com/your-org/repo-three.git
      #   app_name: repo-three
      #   exclude_paths: src/test,vendor
