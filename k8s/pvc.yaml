# =============================================================================
# pvc.yaml - PersistentVolumeClaim for QSE Pod scan results and state
#
# Stores:
#   - last_commit file (last processed commit SHA)
#   - QSE scan result JSON files
#
# Changes:
#   2026-08-21 - Initial creation
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qse-pod-results
  namespace: qse-pod
  labels:
    app: qse-pod
spec:
  accessModes:
    - ReadWriteOnce   # Use ReadWriteMany if multiple pods need concurrent access
  resources:
    requests:
      storage: 5Gi
  # storageClassName: standard  # Uncomment and set to your cluster's StorageClass
